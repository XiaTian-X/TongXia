# 只升级 workflow 里引用的 GitHub Actions 版本。
# 合并约定:只在协议 idle、且本地已推送时合并;合并后本地立刻 git pull --ff-only,不变基本地的协议提交。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # 所有 Actions 升级合成一个 PR:分开开时 checkout 与 setup-python 两行相邻,先合一个、另一个必冲突。
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
