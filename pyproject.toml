[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pair-protocol"
version = "1.0.0"
description = "同夏 TóngXià — 双 AI agent 结对编程协议：一个写测试、一个写实现，严格轮流、互相评审；红绿由测试判定，规则由脚本强制。以 Agent Skill 分发，Claude Code / Codex / Cursor / Gemini CLI 等通用"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
pair = "pair_bootstrap:main"

[tool.hatch.build.targets.wheel]
packages = ["cli/pair_bootstrap"]

# 协议目录是唯一真源,构建时原样打进包里。
# CLI 不复制、不改写协议内容,只负责把它搬到目标项目。
[tool.hatch.build.targets.wheel.force-include]
".agents/skills/pair-protocol" = "pair_bootstrap/skill"
